spring:
  application:
    name: business-platform

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/business_platform}
    username: ${DB_USERNAME:business_admin}
    password: ${DB_PASSWORD:business_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Antes estaba en "update": Hibernate alteraba el esquema solo en cada
      # arranque, sin historial ni posibilidad de rollback. Ahora Flyway es
      # la única fuente de verdad del esquema (ver db/migration) y Hibernate
      # solo valida que las entidades coincidan con lo que Flyway aplicó.
      ddl-auto: ${DDL_AUTO:validate}
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

# Clave usada para firmar los JWT que el SaaS emite.
# Las apps hijas (agencia_turismo, control_acceso) deben usar
# ESTA MISMA clave (vía variable de entorno JWT_SECRET) para poder
# validar el token sin tener que llamar de vuelta al SaaS en cada request.
app:
  jwt:
    secret: ${JWT_SECRET:business-platform-secret-key-change-this-in-production-2026}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    # Orígenes permitidos separados por coma. En producción poner los
    # dominios reales del frontend (ej: https://app.tudominio.com)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
