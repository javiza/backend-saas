spring:
  application:
    name: business-platform

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/business_platform}
    username: ${DB_USERNAME:business_admin}
    password: ${DB_PASSWORD:business_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Antes estaba en "update": Hibernate alteraba el esquema solo en cada
      # arranque, sin historial ni posibilidad de rollback. Ahora Flyway es
      # la única fuente de verdad del esquema (ver db/migration) y Hibernate
      # solo valida que las entidades coincidan con lo que Flyway aplicó.
      ddl-auto: ${DDL_AUTO:validate}
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

# Clave usada para firmar los JWT que el SaaS emite.
# Las apps hijas (agencia_turismo, control_acceso) deben usar
# ESTA MISMA clave (vía variable de entorno JWT_SECRET) para poder
# validar el token sin tener que llamar de vuelta al SaaS en cada request.
app:
  jwt:
    secret: ${JWT_SECRET:business-platform-secret-key-change-this-in-production-2026}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  # BootstrapAdminInitializer usa esto para crear, una sola vez, el primer
  # usuario ADMIN de plataforma (solo si todavía no existe ningún ADMIN).
  # Antes no había forma de crear el primer ADMIN: /api/auth/register
  # siempre crea un MANAGER, y POST /api/users ahora requiere ya ser ADMIN.
  # CAMBIAR la contraseña por defecto antes de ir a producción.
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@plataforma.local}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:ChangeMe123!}
  cors:
    # Orígenes permitidos separados por coma. En producción poner los
    # dominios reales del frontend (ej: https://app.tudominio.com)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  # Base del frontend (SPA). Se usa para redirigir de vuelta al portal
  # cliente tras flujos que necesitan que el navegador salga de nuestro
  # dominio, como la inscripción de tarjeta en Transbank (ver
  # WebpayReturnController).
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

# Tarjeta guardada + cobro recurrente vía Oneclick (Transbank). Las
# credenciales por defecto son las públicas de INTEGRACIÓN (ambiente de
# pruebas de Transbank) — en producción hay que sobreescribir TODAS estas
# variables con las credenciales reales entregadas por Transbank al afiliarse.
transbank:
  oneclick:
    # INTEGRATION (pruebas, no cobra plata real) o PRODUCTION.
    environment: ${TRANSBANK_ENVIRONMENT:INTEGRATION}
    commerce-code: ${TRANSBANK_COMMERCE_CODE:597055555541}
    api-key: ${TRANSBANK_API_KEY:579B532A7440BB0C9079DED94D31EA1615BACEB56610332264630D42D0A36B1C}
    # Código de comercio "hijo" contra el que se cargan los cobros
    # (Oneclick siempre opera en modalidad Mall, aunque haya un solo comercio).
    child-commerce-code: ${TRANSBANK_CHILD_COMMERCE_CODE:597055555542}
    # Transbank vuelve a esta URL con un POST (form-urlencoded, no fetch)
    # que trae token_ws en el body. Un navegador no puede leer el body de
    # una navegación POST, así que esto NO puede apuntar directo al SPA:
    # apunta a WebpayReturnController (backend), que recibe el POST y
    # redirige (302, GET) al frontend con el token como query param, algo
    # que el SPA sí puede leer (ver PaymentCallback.jsx).
    response-url: ${TRANSBANK_RESPONSE_URL:http://localhost:8080/api/payment-methods/webpay-return}
